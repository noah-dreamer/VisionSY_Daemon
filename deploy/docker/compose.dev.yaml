# ==================================================================
# VisionSY 开发覆盖（compose.dev.yaml）
#
# 用法：docker compose -f compose.yaml -f compose.dev.yaml --env-file .env up -d
#
# 在基础之上增加：
#   - 源码绑定挂载（PHP 改动即时生效），并用匿名卷保护 vendor / node_modules，
#     避免被本机（尤其 Windows）产物覆盖或产生权限问题；
#   - Vite HMR 服务（仅开发）；
#   - 暴露 MariaDB 端口到宿主机，便于本地客户端调试。
#
# 说明：APP_ENV / APP_DEBUG 等来自 .env（建议使用 .env.dev.example 复制为 .env）。
# ==================================================================

x-dev-source: &dev-source
  build:
    args:
      # dev 镜像安装 Composer dev 依赖（phpunit/collision），使容器内可运行 php artisan test
      INSTALL_COMPOSER_DEV: "1"
  volumes:
    # 绑定源码以支持热重载；/app/vendor 与 /app/node_modules 用匿名卷保护
    # （首次从镜像初始化，得到 Linux 兼容的依赖，屏蔽宿主机目录）。
    # 注意：切换 dev/prod 镜像后若依赖不一致，用 `up -d --build --renew-anon-volumes` 刷新匿名卷。
    - ../../web:/app
    - /app/vendor
    - /app/node_modules

services:
  app:
    <<: *dev-source

  worker:
    <<: *dev-source

  scheduler:
    <<: *dev-source

  db:
    ports:
      - "${DB_HOST_PORT:-3306}:3306"

  vite:
    image: node:22-alpine
    working_dir: /app
    # 使用统一入口脚本启动 Vite：
    #   - 清理上一次残留的 public/hot
    #   - npm install（node_modules 卷保护，幂等）
    #   - 启动 Vite 并自动把 public/hot 修正为 localhost（取代 Docker 内部 0.0.0.0），
    #     确保浏览器可以访问 HMR 与资源。
    # 注意：bind mount 未挂载 docker/ 子目录时脚本无法执行，请确认 compose.dev.yaml 的 volumes 配置。
    command: ["sh", "/app/docker/vite-dev.sh"]
    volumes:
      - ../../web:/app
      - vite_node_modules:/app/node_modules
    environment:
      # Windows / Docker Desktop 下文件事件不可靠，启用轮询监听
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - visionsy

volumes:
  vite_node_modules:
