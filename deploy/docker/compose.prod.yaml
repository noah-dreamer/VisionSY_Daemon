# Standalone production configuration: one container, four supervised processes.
# docker compose -f compose.prod.yaml --env-file .env up -d --build --wait
name: visionsy
services:
  app:
    build:
      context: ../../web
      dockerfile: Dockerfile
      target: production
    image: visionsy-app:${APP_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SERVER_NAME: ":80"
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-visionsy}
      DB_USERNAME: ${DB_USERNAME:-visionsy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SOCKET: ""
      MARIADB_DATABASE: ${DB_DATABASE:-visionsy}
      MARIADB_USER: ${DB_USERNAME:-visionsy}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_ROOT_HOST: localhost
      MARIADB_INITDB_SKIP_TZINFO: "1"
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - storage:/app/storage
      - bootstrap_cache:/app/bootstrap/cache
      - db_data:/var/lib/mysql
      - ${DAM_HOST_MANAGED:-./data/media}:/data/visionsy/managed
      - type: volume
        source: storage
        target: /app/public/storage
        volume:
          subpath: app/public
          nocopy: true
    restart: unless-stopped
    # Workers finish before MariaDB shuts down. Match the queue job timeout.
    stop_grace_period: 65m
    networks:
      - visionsy
volumes:
  storage:
  bootstrap_cache:
  db_data:
networks:
  visionsy:
    driver: bridge
