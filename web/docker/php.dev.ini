; VisionSY 开发 PHP 配置（由 compose.dev.yaml bind-mount 覆盖生产 ini）
;
; 与 php.prod.ini 的区别：
;   - OPcache revalidate_freq=2（2 秒内感知源码变更，远快于生产的 60s）
;   - 允许 proc_open/popen（Laravel artisan 命令需要）
;   - 显示错误（配合 APP_DEBUG=true）

upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
memory_limit = 512M

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL

; OPcache 开发优化：启用但快速感知文件变更
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.enable_cli = 0
opcache.enable_file_override = 0
opcache.max_wasted_percentage = 5

; 开发不限制（artisan 命令需要 proc_open）
; 生产版 php.prod.ini 会覆盖这些函数限制
