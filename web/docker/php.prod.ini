; VisionSY 生产 PHP 配置（由 Dockerfile COPY 到 /usr/local/etc/php/conf.d/）
;
; 与 Caddy request_body.max_size 和 Laravel MEDIA_MAX_UPLOAD_MB 保持一致。

upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
memory_limit = 512M

; 生产禁用错误输出（APP_DEBUG=false 配合；详细错误只写日志不输出）
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Opcache 生产推荐
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.enable_cli = 0

; 安全：禁用危险函数（根据实际需要调整）
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; 会话安全（生产推荐，Laravel 已通过中间件管理，此处为 PHP 层面兜底）
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
