[unix_http_server]
file=/run/visionsy/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/visionsy/supervisord.pid
childlogdir=/run/visionsy

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/visionsy/supervisor.sock

[program:database]
command=/usr/local/bin/mariadb-entrypoint.sh mariadbd --datadir=/var/lib/mysql --socket=/run/mysqld/mysqld.sock --bind-address=127.0.0.1 --port=3306
priority=10
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bootstrap]
command=/etc/visionsy/bootstrap.sh
directory=/app
priority=20
autostart=true
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[group:application]
programs=web,worker,scheduler
priority=30

[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/app
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=php -d disable_functions= artisan queue:work --queue=default,scan,derivatives,upload --sleep=3 --tries=3 --timeout=3600 --max-time=3600 --max-jobs=1000
directory=/app
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=3610
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=php -d disable_functions= artisan schedule:work
directory=/app
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=3610
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
